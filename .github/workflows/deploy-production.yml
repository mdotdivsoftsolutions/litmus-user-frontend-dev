name: User Frontend - Production Deploy

# Push to main -> verify the Next.js build compiles in GitHub Actions ->
# SSH into EC2 -> pull the same commit, rebuild in place and reload PM2
# (process "litmus-user-web" on port 3000, see deployment guide section 10).
# If the CI build fails, production is never touched.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: user-frontend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ==========================================
  # STAGE 1: Build check (gate before touching the server)
  # ==========================================
  build-check:
    name: Verify Production Build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # ==========================================
  # STAGE 2: Deploy to EC2 (build on server, reload PM2)
  # ==========================================
  deploy:
    name: Deploy to litmuslabs.in
    needs: build-check
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - name: Pull, Build & Reload on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/litmus-deployment/user-frontend
            test -f .env.production || { echo ".env.production missing on server"; exit 1; }

            OLD_LOCK=$(sha1sum package-lock.json | cut -d' ' -f1)
            git fetch origin main
            git reset --hard ${{ github.sha }}
            NEW_LOCK=$(sha1sum package-lock.json | cut -d' ' -f1)

            # Reinstall only when dependencies changed (saves time + RAM)
            if [ "$OLD_LOCK" != "$NEW_LOCK" ] || [ ! -d node_modules ]; then
              echo "package-lock.json changed -> npm ci"
              npm ci
            fi

            NEXT_TELEMETRY_DISABLED=1 npm run build
            pm2 reload litmus-user-web --update-env
            pm2 save

            # Wait for Next.js to answer on port 3000
            for i in $(seq 1 15); do
              if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
                echo "litmus-user-web is up (${{ github.sha }})"
                exit 0
              fi
              sleep 2
            done
            echo "litmus-user-web did not respond on :3000"
            pm2 logs litmus-user-web --lines 40 --nostream
            exit 1

      - name: Smoke Test
        run: curl -fsS -o /dev/null -w "HTTP %{http_code}\n" https://litmuslabs.in/
